<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Student Punctuality</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Smart Student Punctuality</h1>
        <p>Helping students arrive on time</p>
    </header>

    <main>

        <section class="welcome">
            <h2>Welcome, Student 👋</h2>
            <p>Check your classes and punctuality.</p>
        </section>

        <section class="dashboard">

            <div class="card">
                <h3>Next Class</h3>
                <p>Python</p>
                <p>8:30 AM</p>
            </div>

            <div class="card">
                <h3>Today's Status</h3>
                <p>On Time ✅</p>
            </div>

            <div class="card">
                <h3>Punctuality</h3>
                <p>85%</p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
